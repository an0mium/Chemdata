[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = 
    --verbose
    --cov=binding_data_processor
    --cov=web_enrichment
    --cov=web
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage/coverage.xml
    --html=reports/test-results/report.html
    --self-contained-html
    --durations=10

# Coverage configuration
[coverage:run]
branch = True
source = 
    binding_data_processor
    web_enrichment
    web

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError:
    if TYPE_CHECKING:
ignore_errors = True
omit =
    tests/*
    setup.py
    */tests/*
    */examples/*
    */__init__.py

[coverage:html]
directory = reports/coverage

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    web: marks tests that require web access
    ml: marks tests that require ML models
    gpu: marks tests that require GPU
    serial: marks tests that cannot run in parallel

# Plugin configurations
[tool:pytest]
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::ImportWarning

# Logging configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Cache configuration
cache_dir = .pytest_cache

# Temporary directory configuration
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# Test selection
norecursedirs = 
    *.egg
    .git
    .tox
    .env
    .venv
    dist
    build
    docs

# Parallel execution
[tool:pytest-xdist]
numprocesses = auto

# HTML report settings
[tool:pytest-html]
report_title = ChemData Test Report
report_format = html

# Coverage threshold settings
[coverage:fail_under]
total = 80
branch = 80

# Coverage path adjustments
[coverage:paths]
source =
    binding_data_processor/
    web_enrichment/
    web/

# Coverage XML report settings
[coverage:xml]
output = reports/coverage/coverage.xml

# Test database settings
[test]
database_url = sqlite:///:memory:
test_data_dir = tests/data

# ML model settings
[ml]
model_dir = tests/models
batch_size = 2
use_gpu = false

# Web test settings
[web]
test_server_port = 8050
headless = true
screenshot_dir = reports/screenshots

# API test settings
[api]
mock_responses = true
rate_limit = 0.1

# Social media test settings
[social]
use_mock_data = true
mock_data_dir = tests/data/social

# Cache test settings
[cache]
use_temp_dir = true
ttl = 60
