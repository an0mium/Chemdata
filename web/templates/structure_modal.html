<!-- Structure Drawing Modal -->
<div class="modal fade" id="structure-modal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Structure Editor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Ketcher Editor Container -->
                <div id="ketcher-container" class="ketcher-container"></div>

                <!-- Structure Input Options -->
                <div class="mt-3">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text">SMILES</span>
                                <input type="text" id="smiles-input" class="form-control" 
                                       placeholder="Enter SMILES string">
                                <button class="btn btn-outline-secondary" type="button" id="load-smiles">
                                    Load
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text">MOL File</span>
                                <input type="file" id="mol-file-input" class="form-control" 
                                       accept=".mol,.sdf">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Template Structures -->
                <div class="mt-3">
                    <h6>Common Templates</h6>
                    <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-2" id="structure-templates">
                        <!-- Template buttons will be dynamically added here -->
                    </div>
                </div>

                <!-- Structure Tools -->
                <div class="mt-3">
                    <div class="btn-group">
                        <button type="button" class="btn btn-outline-secondary" id="clean-structure">
                            <i class="bi bi-magic"></i> Clean
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="flip-horizontal">
                            <i class="bi bi-arrow-left-right"></i> Flip H
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="flip-vertical">
                            <i class="bi bi-arrow-down-up"></i> Flip V
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="clear-canvas">
                            <i class="bi bi-trash"></i> Clear
                        </button>
                    </div>
                </div>

                <!-- Structure Validation -->
                <div class="mt-3">
                    <div class="alert alert-info" id="structure-info" style="display: none;">
                        <h6 class="alert-heading">Structure Information</h6>
                        <div id="structure-properties"></div>
                    </div>
                    <div class="alert alert-warning" id="structure-warnings" style="display: none;">
                        <h6 class="alert-heading">Warnings</h6>
                        <ul class="mb-0" id="warning-list"></ul>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="me-auto">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="auto-clean" checked>
                        <label class="form-check-label" for="auto-clean">Auto-clean</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="show-implicit-h" checked>
                        <label class="form-check-label" for="show-implicit-h">Show Implicit H</label>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="use-structure">
                    Use Structure
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Structure Template Modal -->
<div class="modal fade" id="template-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Template</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="template-name">
                </div>
                <div class="mb-3">
                    <label class="form-label">SMILES</label>
                    <input type="text" class="form-control" id="template-smiles">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="template-category">
                        <option value="common">Common Structures</option>
                        <option value="rings">Ring Systems</option>
                        <option value="functional">Functional Groups</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-template">Save</button>
            </div>
        </div>
    </div>
</div>
