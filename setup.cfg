[metadata]
name = binding_data_processor
version = 0.2.0
description = A comprehensive pipeline for processing and analyzing chemical compound data
long_description = file: README.md
long_description_content_type = text/markdown
author = ChemData Contributors
author_email = your.email@example.com
url = https://github.com/yourusername/chemdata
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Chemistry
    Topic :: Scientific/Engineering :: Bio-Informatics
    Topic :: Scientific/Engineering :: Artificial Intelligence
keywords =
    chemistry
    machine learning
    data processing
    binding data
    psychopharmacology
    drug discovery
project_urls =
    Documentation = https://chemdata.readthedocs.io/
    Source = https://github.com/yourusername/chemdata
    Issues = https://github.com/yourusername/chemdata/issues

[options]
packages = find:
python_requires = >=3.8
zip_safe = False
include_package_data = True
install_requires =
    numpy>=1.21.0
    pandas>=1.3.0
    scipy>=1.7.0
    scikit-learn>=1.0.0
    rdkit>=2022.3.1
    mordred>=1.2.0
    openbabel>=3.1.0
    torch>=1.10.0
    torch-geometric>=2.0.0
    transformers>=4.15.0
    xgboost>=1.5.0
    lightgbm>=3.3.0
    requests>=2.26.0
    beautifulsoup4>=4.10.0
    praw>=7.5.0
    tweepy>=4.4.0
    discord.py>=2.0.0
    atproto>=0.0.20
    dash>=2.0.0
    dash-bootstrap-components>=1.0.0
    plotly>=5.3.0
    flask>=2.0.0
    flask-caching>=1.10.0
    tqdm>=4.62.0
    joblib>=1.1.0
    dask>=2022.1.0
    distributed>=2022.1.0
    pyarrow>=6.0.0
    matplotlib>=3.5.0
    seaborn>=0.11.0
    networkx>=2.6.0
    python-dotenv>=0.19.0
    pyyaml>=6.0.0
    click>=8.0.0
    loguru>=0.5.0
    rich>=10.16.0

[options.extras_require]
dev =
    black>=21.12b0
    flake8>=4.0.0
    mypy>=0.910
    isort>=5.10.0
    pre-commit>=2.16.0
test =
    pytest>=6.2.5
    pytest-cov>=2.12.0
    pytest-mock>=3.6.0
docs =
    sphinx>=4.3.0
    sphinx-rtd-theme>=1.0.0
    nbsphinx>=0.8.0
    jupyter>=1.0.0

[options.package_data]
* = *.json, *.yaml, *.html, *.css, *.js

[options.entry_points]
console_scripts =
    chemdata = binding_data_processor.cli:main
    chemdata-web = binding_data_processor.web.app:main

[flake8]
max-line-length = 180
ignore = F401,E203,W503  # Ignore unused imports and some formatting rules
exclude =
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .eggs,
    .tox,
    .venv,
    venv,
    .env,
    docs
per-file-ignores =
    __init__.py: F401
    tests/*: E501,F401
max-complexity = 10
statistics = True
count = True

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 180
skip =
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .eggs,
    .tox,
    .venv,
    venv,
    .env,
    docs
skip_glob = .venv/*,venv/*,.env/*
known_first_party =
    binding_data_processor
    web_enrichment
    web
known_third_party =
    numpy
    pandas
    pytest
    rdkit
    requests
    torch
    tqdm
    yaml

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_optional = True
ignore_missing_imports = True
exclude =
    tests/
    docs/
    examples/
    setup.py

[mypy.plugins.numpy.*]
plugin_modules = numpy.typing.mypy_plugin

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-rdkit.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=binding_data_processor
    --cov=web_enrichment
    --cov=web
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --doctest-modules
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    gpu: marks tests that require GPU
    web: marks tests that require web access

[coverage:run]
branch = True
source =
    binding_data_processor
    web_enrichment
    web

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError:
    if TYPE_CHECKING:
ignore_errors = True
omit =
    tests/*
    setup.py
    */tests/*
    */examples/*
    */__init__.py

[black]
line-length = 180
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/docs
'''
