# Bandit configuration file
# https://bandit.readthedocs.io/en/latest/config.html

# Test profiles
profiles:
  # Custom profile for ChemData project
  chemdata:
    include:
      - binding_data_processor/
      - web_enrichment/
      - web/
    exclude:
      - binding_data_processor/tests/
      - web_enrichment/tests/
      - web/tests/
    tests:
      - B101  # assert_used
      - B102  # exec_used
      - B103  # set_bad_file_permissions
      - B104  # hardcoded_bind_all_interfaces
      - B105  # hardcoded_password_string
      - B106  # hardcoded_password_funcarg
      - B107  # hardcoded_password_default
      - B108  # hardcoded_tmp_directory
      - B110  # try_except_pass
      - B112  # try_except_continue
      - B201  # flask_debug_true
      - B301  # pickle
      - B302  # marshal
      - B303  # md5
      - B304  # ciphers
      - B305  # cipher_modes
      - B306  # mktemp_q
      - B307  # eval
      - B308  # mark_safe
      - B309  # httpsconnection
      - B310  # urllib_urlopen
      - B311  # random
      - B312  # telnetlib
      - B313  # xml_bad_cElementTree
      - B314  # xml_bad_ElementTree
      - B315  # xml_bad_expatreader
      - B316  # xml_bad_expatbuilder
      - B317  # xml_bad_sax
      - B318  # xml_bad_minidom
      - B319  # xml_bad_pulldom
      - B320  # xml_bad_etree
      - B321  # ftplib
      - B323  # unverified_context
      - B324  # hashlib_new_insecure_functions
      - B325  # tempnam
      - B401  # import_telnetlib
      - B402  # import_ftplib
      - B403  # import_pickle
      - B404  # import_subprocess
      - B405  # import_xml_etree
      - B406  # import_xml_sax
      - B407  # import_xml_expat
      - B408  # import_xml_minidom
      - B409  # import_xml_pulldom
      - B410  # import_lxml
      - B411  # import_xmlrpclib
      - B412  # import_httpoxy
      - B413  # import_pycrypto
      - B501  # request_with_no_cert_validation
      - B502  # ssl_with_bad_version
      - B503  # ssl_with_bad_defaults
      - B504  # ssl_with_no_version
      - B505  # weak_cryptographic_key
      - B506  # yaml_load
      - B507  # ssh_no_host_key_verification
      - B601  # paramiko_calls
      - B602  # subprocess_popen_with_shell_equals_true
      - B603  # subprocess_without_shell_equals_true
      - B604  # any_other_function_with_shell_equals_true
      - B605  # start_process_with_a_shell
      - B606  # start_process_with_no_shell
      - B607  # start_process_with_partial_path
      - B608  # hardcoded_sql_expressions
      - B609  # linux_commands_wildcard_injection
      - B610  # django_extra_used
      - B611  # django_rawsql_used
      - B701  # jinja2_autoescape_false
      - B702  # use_of_mako_templates
      - B703  # django_mark_safe

# Test skipping
skips:
  # Skip tests in test files
  - "*/test_*.py"
  - "*/tests/*"
  # Skip examples
  - "*/examples/*"
  # Skip documentation
  - "*/docs/*"

# File patterns to exclude
exclude_dirs:
  - ".git"
  - "__pycache__"
  - "build"
  - "dist"
  - "*.egg-info"
  - ".eggs"
  - ".tox"
  - ".venv"
  - "venv"
  - ".env"
  - "docs"
  - "tests/data"

# Per-file-ignores
per_file_ignores:
  # Allow assert in test files
  "*/test_*.py": ["B101"]
  # Allow subprocess in scripts
  "scripts/*.py": ["B404"]
  # Allow pickle in ML model files
  "*/ml/*.py": ["B301", "B403"]

# Custom test settings
any_other_function_with_shell_equals_true:
  no_shell:
    - os.execl
    - os.execle
    - os.execlp
    - os.execlpe
    - os.execv
    - os.execve
    - os.execvp
    - os.execvpe
    - os.spawnl
    - os.spawnle
    - os.spawnlp
    - os.spawnlpe
    - os.spawnv
    - os.spawnve
    - os.spawnvp
    - os.spawnvpe
    - subprocess.Popen
    - subprocess.call
    - subprocess.check_call
    - subprocess.check_output
    - subprocess.run

hardcoded_tmp_directory:
  tmp_dirs:
    - "/tmp"
    - "/var/tmp"
    - "/dev/shm"

ssl_with_bad_defaults:
  bad_protocol_versions:
    - PROTOCOL_SSLv2
    - SSLv2_METHOD
    - SSLv23_METHOD
    - PROTOCOL_SSLv3
    - PROTOCOL_TLSv1
    - SSLv3_METHOD
    - TLSv1_METHOD

shell_injection:
  subprocess:
    - subprocess.Popen
    - subprocess.call
    - subprocess.check_call
    - subprocess.check_output
    - subprocess.run
  shell:
    - os.system
    - os.popen
    - os.popen2
    - os.popen3
    - os.popen4
    - popen2.popen2
    - popen2.popen3
    - popen2.popen4
    - popen2.Popen3
    - popen2.Popen4
    - commands.getoutput
    - commands.getstatusoutput

hardcoded_password_string:
  strings:
    - "password"
    - "passwd"
    - "pwd"
    - "secret"
    - "token"
    - "api_key"
    - "auth"
    - "credentials"

# Severity levels
any_other_function_with_shell_equals_true: HIGH
assert_used: LOW
hardcoded_bind_all_interfaces: MEDIUM
hardcoded_password_default: LOW
hardcoded_password_funcarg: HIGH
hardcoded_password_string: HIGH
hardcoded_sql_expressions: MEDIUM
hardcoded_tmp_directory: MEDIUM
jinja2_autoescape_false: MEDIUM
linux_commands_wildcard_injection: MEDIUM
missing_function_docstring: LOW
password_config_option_not_marked_secret: MEDIUM
request_with_no_cert_validation: HIGH
set_bad_file_permissions: MEDIUM
subprocess_popen_with_shell_equals_true: HIGH
subprocess_without_shell_equals_true: HIGH
try_except_continue: LOW
try_except_pass: LOW
weak_cryptographic_key: HIGH

# Output settings
output_format: text
output_level: LOW
msg_template: "{abspath}:{line}: {test_id}[{severity}]: {msg}"
output_colors: True
verbose: True
quiet: False

# Number of lines of context to display for each issue
context_lines: 3

# Progress tracking
show_progress_every: 100

# Logging configuration
logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  level: INFO
