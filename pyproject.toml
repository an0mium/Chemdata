[project]
name = "binding_data_processor"
version = "0.2.0"
description = "A comprehensive pipeline for processing and analyzing chemical compound data"
authors = [
    {name = "ChemData Contributors", email = "your.email@example.com"}
]
requires-python = ">=3.8"
readme = "README.md"
license = {file = "LICENSE"}

dependencies = [
    # Core dependencies
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pyarrow>=6.0.0",
    
    # Chemistry tools
    "rdkit>=2022.3.1",
    "mordred>=1.2.0",
    "openbabel>=3.1.0",
    "pubchempy>=1.0.4",
    
    # Machine learning
    "torch>=1.10.0",
    "torch-geometric>=2.0.0",
    "transformers>=4.15.0",
    "pytorch-lightning>=1.5.0",
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
    "optuna>=2.10.0",
    
    # Web scraping and APIs
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.1.0",
    "aiohttp>=3.8.0",
    "praw>=7.5.0",
    "tweepy>=4.4.0",
    "discord.py>=2.0.0",
    "atproto>=0.0.20",
    "ratelimit>=2.2.1",
    "backoff>=2.2.1",
    "serpapi>=0.1.0",
    "openai>=1.0.0",
    
    # Web interface
    "dash>=2.0.0",
    "dash-bio>=1.0.0",
    "dash-bootstrap-components>=1.0.0",
    "plotly>=5.3.0",
    "flask>=2.0.0",
    "flask-caching>=1.10.0",
    "fastapi>=0.70.0",
    "uvicorn>=0.15.0",
    "pydantic>=1.8.0",
    "starlette>=0.16.0",
    "jinja2>=3.0.0",
    "werkzeug>=2.0.0",
    "pillow>=10.0.0",
    "datatables>=0.4.9",
    "bootstrap-flask>=2.0.0",
    
    # Data processing
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
    "dask>=2022.1.0",
    "distributed>=2022.1.0",
    "networkx>=2.6.0",
    "openpyxl>=3.1.2",
    "python-dateutil>=2.8.2",
    
    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "ipywidgets>=8.1.0",
    
    # XML and PDF processing
    "lxml>=5.1.0",
    "html5lib>=1.1",
    "xmltodict>=0.13.0",
    "defusedxml>=0.7.1",
    "pypdf>=3.0.0",
    "pdfminer.six>=20221105",
    
    # Utilities
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "loguru>=0.5.0",
    "rich>=10.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.0",
    "pre-commit>=2.16.0",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "binding_data_processor/_version.py"

[tool.black]
line-length = 120
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/docs
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    ".tox",
    ".venv",
    "venv",
    ".env",
    "docs"
]
skip_glob = [".venv/*", "venv/*", ".env/*"]
known_first_party = [
    "binding_data_processor",
    "web_enrichment",
    "web"
]
known_third_party = [
    "numpy",
    "pandas",
    "pytest",
    "rdkit",
    "requests",
    "torch",
    "tqdm",
    "yaml"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --verbose
    --cov=binding_data_processor
    --cov=web_enrichment
    --cov=web
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --doctest-modules
"""
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
    "web: marks tests that require web access"
]

[tool.coverage.run]
branch = true
source = [
    "binding_data_processor",
    "web_enrichment",
    "web"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "except ImportError:",
    "if TYPE_CHECKING:"
]
ignore_errors = true
omit = [
    "tests/*",
    "setup.py",
    "*/tests/*",
    "*/examples/*",
    "*/__init__.py"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
    "examples/",
    "setup.py"
]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "rdkit.*",
    "torch.*",
    "pytest.*"
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "test",
    "docs",
    "examples",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    ".tox",
    ".venv",
    "venv",
    ".env"
]
skips = ["B101", "B404", "B603", "B607"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py38, py39, py310
isolated_build = True

[testenv]
deps =
    -r{toxinidir}/requirements.txt
    pytest
    pytest-cov
commands =
    pytest {posargs:tests}
"""
